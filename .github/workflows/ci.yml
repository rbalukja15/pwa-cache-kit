name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pull requests share one group per PR so a new push cancels the outdated run.
  # Pushes to main are grouped per commit, so every commit on main gets a full run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level permissions replace the top-level ones, so contents: read is repeated here.
    # id-token: write lets the Codecov step authenticate with OIDC instead of a stored token.
    # Permissions cannot differ per matrix leg; only the Node 24 leg requests a token.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

      - name: Smoke-test the packed tarball
        run: npm run test:pack

      - name: Upload coverage to Codecov
        if: matrix.node-version == '24.x'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: false

  e2e:
    name: Browsers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser smoke tests
        run: npm run test:e2e

  changeset:
    name: Changeset
    # A pull request that changes the library's src/ or package.json needs a changeset
    # (`npx changeset`, or `npx changeset --empty` for a change with no user-facing effect).
    # .changeset/config.json limits changedFilePatterns to those files, so docs, tests and
    # tooling pass without one.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # changeset status diffs against the base branch, so it needs the full history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for a changeset
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npx changeset status --since="origin/$BASE_REF"
