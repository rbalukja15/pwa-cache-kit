name: Release

# Publishes @rbalukja/pwa-cache-kit to npm when a version tag (v0.1.0, v0.1.1, ...) is pushed.
# docs/releasing.md has the steps that lead up to the tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Lets npm sign the provenance statement with the workflow's OIDC identity.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The main-branch check below needs the full history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./packages/pwa-cache-kit/package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "::error::Tag $TAG does not match the package version $version. Run npm run version-packages and tag that commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points at a commit that is not on main."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

      - name: Smoke-test the packed tarball
        run: npm run test:pack

      - name: Publish
        run: npm publish -w @rbalukja/pwa-cache-kit --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
